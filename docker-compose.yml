services:
  todolist-app:
    container_name: todolist-app
    #build: .
    image: todolist-app:0.0.0
    ports: 
    - "3000:3000"
    env_file: .env
    networks:
      - network-postgres 

  sonarqube:
    image: sonarqube:26.1.0.118079-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: true
      SONAR_JDBC_URL: ${SONAR_JDBC_URL:-jdbc:postgresql://sonarqube-db:5432/${POSTGRES_DB:-sonar_db}}
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME:-postgres}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD:-postgres}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - network-postgres
### declaration of external network
networks:
  network-postgres:
    name: network-postgres
      